# Configuration du nom de l'application
spring.application.name=order-api

# Configuration de la BDD H2 en mémoire
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Activation de la console Web H2 pour visualiser nos tables dans le navigateur
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'update' va créer/mettre à jour automatiquement les tables SQL selon nos entités (équivalent de doctrine:schema:update)
spring.jpa.hibernate.ddl-auto=update
# Affiche les requêtes SQL exécutées dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true